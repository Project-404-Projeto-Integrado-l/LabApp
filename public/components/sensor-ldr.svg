<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="100%" height="100%">
  <!-- Terminais metálicos -->
  <line x1="45" y1="90" x2="45" y2="155" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="90" x2="75" y2="155" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Cabeça redonda cerâmica do LDR -->
  <defs>
    <radialGradient id="ldrCeramic" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="55" r="38" fill="url(#ldrCeramic)" stroke="#7c2d12" stroke-width="3"/>
  <!-- Trilha em serpentina de Sulfeto de Cádmio (CdS) -->
  <path d="M 40 40 
           C 50 35, 70 35, 80 40
           C 85 45, 80 50, 75 52
           L 45 52
           C 40 54, 40 60, 45 62
           L 75 62
           C 80 64, 80 70, 75 72
           L 40 72" 
        fill="none" 
        stroke="#7f1d1d" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>

