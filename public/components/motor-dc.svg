<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%">
  <!-- Eixo do motor -->
  <rect x="70" y="5" width="20" height="25" fill="#e2e8f0" stroke="#64748b" stroke-width="2" rx="2"/>
  <rect x="70" y="110" width="20" height="25" fill="#e2e8f0" stroke="#64748b" stroke-width="2" rx="2"/>
  
  <!-- Corpo da Caixa de Redução Amarela (TT Motor) -->
  <rect x="25" y="25" width="110" height="90" rx="8" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
  <rect x="35" y="35" width="45" height="70" rx="4" fill="#eab308"/>

  <!-- Orifícios de fixação e detalhe da engrenagem -->
  <circle cx="95" cy="55" r="16" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="95" cy="55" r="6" fill="#475569"/>
  <!-- Terminais de solda -->
  <rect x="15" y="50" width="10" height="8" fill="#94a3b8"/>
  <rect x="15" y="82" width="10" height="8" fill="#94a3b8"/>
  <circle cx="17" cy="54" r="2" fill="#ef4444"/>
  <circle cx="17" cy="86" r="2" fill="#3b82f6"/>
</svg>

