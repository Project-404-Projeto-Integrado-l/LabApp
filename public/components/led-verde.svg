<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="100%" height="100%">
  <!-- Terminais (pernas do LED) -->
  <line x1="45" y1="100" x2="45" y2="155" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="100" x2="75" y2="145" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Corpo do LED Verde -->
  <defs>
    <linearGradient id="ledGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="35%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="ledGlow" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Base com chanfro -->
  <rect x="25" y="90" width="70" height="14" rx="3" fill="#15803d"/>
  <!-- Cúpula semicilíndrica -->
  <path d="M 30 90 L 30 45 A 30 30 0 0 1 90 45 L 90 90 Z" fill="url(#ledGreenGrad)"/>
  <!-- Brilho / reflexo de luz na cúpula -->
  <ellipse cx="48" cy="40" rx="14" ry="20" fill="url(#ledGlow)"/>
  <ellipse cx="44" cy="36" rx="5" ry="8" fill="#ffffff" opacity="0.6"/>
</svg>

